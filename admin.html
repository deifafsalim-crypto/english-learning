<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إصدار أكواد منصة الإنجليزي</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f0;color:#24343a;font:18px/1.8 system-ui}main{max-width:560px;margin:6vh auto;padding:28px;background:#fff;border-radius:24px;box-shadow:0 12px 40px #24343a12}h1{font-size:27px;margin:0}p{color:#5f7278}label{display:block;margin:18px 0 6px}input,button,textarea{width:100%;padding:13px;border-radius:12px;font:inherit}input,textarea{border:1px solid #bccfc3;direction:ltr;text-align:left}button{background:#27866b;color:#fff;border:0;cursor:pointer;margin:14px 0}button.secondary{background:#e3ede7;color:#24343a}#message{color:#a23d35;min-height:28px}[hidden]{display:none!important}</style></head><body><main><h1>إصدار أكواد التفعيل</h1><p>أداة الإدارة الخاصة بك لتفعيل منصة الإنجليزي.</p><form id="unlock"><label for="password">كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="current-password" required><button id="open">فتح أداة الأكواد</button></form><section id="tools" hidden><form id="generate"><label for="request">رقم الطلب الذي وصلك على واتساب</label><input id="request" dir="ltr" required autocomplete="off" spellcheck="false" placeholder="REQ-…"><button>توليد كود التفعيل</button></form><section id="result" hidden><label for="code">كود التفعيل</label><textarea id="code" readonly rows="2"></textarea><button id="copy">نسخ الكود</button></section><button class="secondary" id="lock">قفل الأداة</button></section><div id="message" role="status" aria-live="polite"></div></main><script>
const VAULT={"salt":"QiyhT96Juw9DHFRg61hypw==","iv":"1GEeR7LyF9jYLZaR","iterations":600000,"ciphertext":"MCYm01mHvBAxyX+54R+EOl5Ntkl7fSzKElSMIKBpBCNRA6nc2/wquaFGxu6k1rz5f3JFQvspdCPv+rB5ueJqNFrTKfHz+3ARdCvP2EEuD5YB9De5Lzw8P46DG1/tCUPyymdiQuWQsrUag0iPhCAK/8SPZhEOMQTAXq/LUjJWwkHNw4kV3ZR5gJEIeREZTIgfieUD67H9PbMOq9HkbQz1sddbMTUX8z3CwAtiksNiGk9ojeGJ48Q0WAT1HiiIeKgOhpS45dqZ6K1eRUPz037m0iT4uCE+fyP9giIqnfB8KVbyknMn+VO9kdumuc3rog0l+8OE3Sx7Dw+b1pkBW6T/rO38pwKi9ryRjoh0fr2GvZe/2ADWbtkwW6ZRgU9rc31CVOGN8QKLfjyNrgeytd4j4+ELK8RRGnz4VrroY4fv5sOxC1L7mDu8vGNS51PMaC8YYVqSlU+eOGcI7NG2vWfetolGENEHJAnisleALOWqRCfTykkc7FeN96O1aua3XZxkUPXiqP9Ipw9CxykXiESqGqGjPQUN"};
const encoder=new TextEncoder();let signingKey,contentKey;
const message=document.getElementById('message'),tools=document.getElementById('tools'),unlock=document.getElementById('unlock'),result=document.getElementById('result'),code=document.getElementById('code');
const bytes=value=>Uint8Array.from(atob(value),x=>x.charCodeAt(0));
unlock.onsubmit=async event=>{event.preventDefault();const button=document.getElementById('open');button.disabled=true;message.textContent='جارٍ فتح الأداة…';try{
 const material=await crypto.subtle.importKey('raw',encoder.encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(VAULT.salt),iterations:VAULT.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const secret=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(VAULT.iv)},key,bytes(VAULT.ciphertext));
 const credentials=JSON.parse(new TextDecoder().decode(secret));
 signingKey=await crypto.subtle.importKey('jwk',credentials.privateKey,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);contentKey=credentials.contentKey;
 new Uint8Array(secret).fill(0);document.getElementById('password').value='';unlock.hidden=true;tools.hidden=false;message.textContent='';document.getElementById('request').focus();
 }catch{message.textContent='كلمة مرور الإدارة غير صحيحة، أو تعذر فتح الأداة.';}finally{button.disabled=false;}};
document.getElementById('generate').onsubmit=async event=>{event.preventDefault();result.hidden=true;const id=document.getElementById('request').value.trim().toUpperCase();if(!/^REQ-[A-F0-9]{32}$/.test(id)){message.textContent='رقم الطلب غير صحيح. انسخه كاملًا من رسالة الطالب.';return;}try{
 const encode=value=>btoa(String.fromCharCode(...value)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const payload=encode(encoder.encode(JSON.stringify({id,key:contentKey})));
 const signature=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},signingKey,encoder.encode(payload)));
 code.value=payload+'.'+encode(signature);result.hidden=false;message.textContent='أرسل هذا الكود لصاحب الطلب.';
 }catch{message.textContent='تعذر إصدار الكود. افتح الأداة مجددًا.';}};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);message.textContent='تم نسخ الكود.';}catch{code.focus();code.select();message.textContent='حدد الكود وانسخه يدويًا.';}};
document.getElementById('lock').onclick=()=>{signingKey=null;contentKey=null;code.value='';result.hidden=true;tools.hidden=true;unlock.hidden=false;message.textContent='';};
</script></body></html>
