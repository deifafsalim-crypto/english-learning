<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل منصة الإنجليزي</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f0;color:#24343a;font:18px/1.8 system-ui}main{max-width:540px;margin:6vh auto;padding:28px;background:white;border-radius:24px;box-shadow:0 16px 48px #24343a15}h1{margin:0;font-size:28px}p{color:#5f7278}label{display:block;margin:18px 0 8px}input,button,a.action{width:100%;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #bccfc3;text-align:left;direction:ltr}button,a.action{display:block;border:0;background:#27866b;color:white;text-decoration:none;text-align:center;cursor:pointer;margin:12px 0}button.secondary{background:#e3ede7;color:#24343a}.request{background:#eef4f0;padding:14px;border-radius:12px;overflow-wrap:anywhere;font-size:16px;text-align:center}#message{color:#a23d35;min-height:28px}iframe{width:100%;height:100dvh;border:0;display:block}nav{display:flex;gap:8px;padding:8px;background:white}nav button{margin:0;padding:6px;font-size:14px}[hidden]{display:none!important}</style></head><body><main id="gate"><h1>تفعيل منصة الإنجليزي</h1><p>لدخول المنصة، أرسل رقم طلبك على واتساب ثم أدخل كود التفعيل الذي يصلك.</p><label>رقم طلب هذا المتصفح</label><div id="request" class="request" dir="ltr"></div><button id="copy" class="secondary">نسخ رقم الطلب</button><a id="whatsapp" class="action" target="_blank" rel="noopener">إرسال الطلب على واتساب</a><form id="form"><label for="code">كود التفعيل</label><input id="code" required autocomplete="off" spellcheck="false"><button id="activate">تفعيل ودخول المنصة</button></form><div id="message" role="status" aria-live="polite"></div><p>يُحفظ التفعيل في هذا المتصفح. مسح بيانات الموقع يتطلب تفعيلًا جديدًا.</p></main><section id="platform" hidden><nav aria-label="اختيار الصف"><button data-course="10">الإنجليزي ١٠</button><button data-course="11">الإنجليزي ١١</button></nav><iframe id="content" title="منصة الإنجليزي"></iframe></section><script>
const PUBLIC_KEY={"kty":"EC","x":"9F7A5aKtyQCyNOIbogi4vV9SZ91vRKVI9Me12hLQWgw","y":"V62D2fYA6diConCpO85uv51WvUFrV9uOa-dHdol2G4g","crv":"P-256"};
const storageKey='english-github-activation-v2';let state;
const encoder=new TextEncoder(),decoder=new TextDecoder();
const message=document.getElementById('message'),gate=document.getElementById('gate'),platform=document.getElementById('platform'),content=document.getElementById('content');
function bytes(value){if(!/^[A-Za-z0-9_-]+$/.test(value))throw Error('كود التفعيل غير صحيح.');let text=value.replace(/-/g,'+').replace(/_/g,'/');text+='='.repeat((4-text.length%4)%4);return Uint8Array.from(atob(text),x=>x.charCodeAt(0));}
function base64bytes(value){return Uint8Array.from(atob(value),x=>x.charCodeAt(0));}
function newState(){return {id:'REQ-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(),code:''};}
function persist(){localStorage.setItem(storageKey,JSON.stringify(state));}
async function verifyAndLoad(course='10',candidate=state.code){
 const parts=candidate.split('.');if(parts.length!==2)throw Error('كود التفعيل غير صحيح.');
 const publicKey=await crypto.subtle.importKey('jwk',PUBLIC_KEY,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 const valid=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},publicKey,bytes(parts[1]),encoder.encode(parts[0]));
 if(!valid)throw Error('كود التفعيل غير صحيح.');
 const payload=JSON.parse(decoder.decode(bytes(parts[0])));if(payload.id!==state.id)throw Error('هذا الكود يخص متصفحًا آخر. أرسل رقم طلب هذا المتصفح لتفعيله.');
 const response=await fetch('./platform-'+course+'.enc.json');if(!response.ok)throw Error('تعذر تحميل المنصة. حاول مرة أخرى.');
 const encrypted=await response.json();
 const key=await crypto.subtle.importKey('raw',bytes(payload.key),{name:'AES-GCM'},false,['decrypt']);
 let html;try{html=decoder.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:base64bytes(encrypted.iv)},key,base64bytes(encrypted.ciphertext)));}catch{throw Error('تعذر فتح المنصة بهذا الكود. اطلب كودًا جديدًا.');}
 const previous=state.code;state.code=candidate;try{persist();}catch{state.code=previous;throw Error('اسمح بحفظ بيانات المتصفح لحفظ التفعيل.');}
 content.srcdoc=html;gate.hidden=true;platform.hidden=false;
}
async function start(){
 try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');state=saved&&/^REQ-[A-F0-9]{32}$/.test(saved.id)?saved:newState();persist();}
 catch{message.textContent='اسمح بحفظ بيانات المتصفح حتى يمكن حفظ رقم الطلب والتفعيل.';document.getElementById('activate').disabled=true;return;}
 document.getElementById('request').textContent=state.id;
 document.getElementById('whatsapp').href='https://wa.me/96895823294?text='+encodeURIComponent('أريد تفعيل منصة الإنجليزي. رقم طلبي: '+state.id);
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(state.id);message.textContent='تم نسخ رقم الطلب.';}catch{message.textContent='يمكنك تحديد رقم الطلب ونسخه يدويًا.';}};
 document.getElementById('form').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('activate');button.disabled=true;message.textContent='جارٍ التحقق…';try{await verifyAndLoad('10',document.getElementById('code').value.replace(/\s/g,''));message.textContent='';}catch(error){message.textContent=error.message;}finally{button.disabled=false;}};
 document.querySelectorAll('[data-course]').forEach(button=>button.onclick=async()=>{try{await verifyAndLoad(button.dataset.course);}catch(error){gate.hidden=false;platform.hidden=true;message.textContent=error.message;}});
 if(state.code)try{await verifyAndLoad();}catch(error){message.textContent=error.message;}
}start();
</script></body></html>
